name: Precios reales

on:
  schedule:
    - cron: '0 10 * * *'   # todos los días a las 07:00 de Chile (verano)
  workflow_dispatch:        # botón "Ejecutar flujo de trabajo" para correrlo a mano
    inputs:
      cadenas:
        description: 'Prueba rápida solo de estas cadenas (ej: unimarc,tottus). Vacío = todas.'
        required: false
        default: ''

permissions:
  contents: write

concurrency: precios

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar precios en la web de cada cadena
        env:
          CADENAS: ${{ inputs.cadenas }}
        run: |
          if [ -n "$CADENAS" ]; then
            node recolectar/recolectar.mjs --prueba "--cadenas=$CADENAS"
          else
            node recolectar/recolectar.mjs
          fi
      - name: Guardar precios.json en el repositorio
        run: |
          git config user.name "rinde-precios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json recolectar/diagnostico.json
          git diff --cached --quiet || git commit -m "Precios del día $(date -u +%F)"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
